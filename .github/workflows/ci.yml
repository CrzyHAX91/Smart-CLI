---
name: CI/CD
'on':
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: Test (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [python, node]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        if: matrix.language == 'python'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: user-workspace/flask-api-service/requirements.txt
      - uses: actions/setup-node@v6
        if: matrix.language == 'node'
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: user-workspace/ai-cli-tool/package-lock.json
      - name: Install Python dependencies
        if: matrix.language == 'python'
        run: |
          python -m pip install -r user-workspace/flask-api-service/requirements.txt
          python -m pip check
      - name: Real Flask HTTP tests
        if: matrix.language == 'python'
        env:
          PYTHONPATH: user-workspace/flask-api-service
        run: python -m pytest user-workspace/flask-api-service/tests -q
      - name: Install CLI dependencies
        if: matrix.language == 'node'
        working-directory: user-workspace/ai-cli-tool
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Offline CLI tests and lint
        if: matrix.language == 'node'
        working-directory: user-workspace/ai-cli-tool
        run: |
          npm test -- --runInBand
          npm run lint
  security_scan:
    name: Dependency security audit
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22.x'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Audit CLI dependency lock
        working-directory: user-workspace/ai-cli-tool
        run: npm audit --audit-level=high
      - name: Audit Python pins
        run: |
          python -m pip install pip-audit
          python -m pip_audit -r user-workspace/flask-api-service/requirements.txt
  release:
    name: 🚀 Release
    needs: [ test, security_scan ]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout with full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Git for tagging
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      - name: Read version
        id: get_version
        run: echo "VERSION=$(cat VERSION)" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ env.VERSION }}
          release_name: Release v${{ env.VERSION }}
          draft: false
          prerelease: false
